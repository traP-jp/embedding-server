services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: embedding-api
    ports:
      - "127.0.0.1:${API_PORT:-8080}:${API_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - embedding-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.32.1@sha256:74e37eb854b2cec5a8bcfdc4b0604a0354fbbf7209b68c3357d3221286bcb1dc
    container_name: embedding-swagger
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - type: bind
        source: ./openapi.yaml
        target: /openapi/openapi.yaml
        read_only: true
    restart: unless-stopped

  cloudflared:
    profiles:
      - tunnel
    image: cloudflare/cloudflared:2026.8.3
    container_name: embedding-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_started
      swagger:
        condition: service_started
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL

  postgres:
    image: postgres:${POSTGRES_VERSION:-18.3}
    container_name: embedding-postgres
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-embedding}"]
      interval: 5s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
      args:
        BNB_BUILD_FROM_SOURCE: "${BNB_BUILD_FROM_SOURCE:-0}"
        BNB_GIT_REF: "${BNB_GIT_REF:-0.49.2}"
        BNB_ROCM_ARCH: "${BNB_ROCM_ARCH:-gfx1030}"
    container_name: embedding-worker
    env_file:
      - .env
    environment:
      WORKER_API_MODE: host
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    ipc: host
    shm_size: 8gb
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - embedding-data:/data
      - worker-cache:/cache

volumes:
  embedding-data:
  postgres-data:
  worker-cache:
